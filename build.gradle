plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'net.vansen'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.hierynomus:sshj:0.39.0'
}

gradlePlugin {
    plugins {
        dexternally {
            id = 'net.vansen.dexternally'
            implementationClass = 'net.vansen.dexternally.DExternallyPlugin'
        }
    }
}